<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daily Range Forecast</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:20px;background:#111;color:#eee}
    .controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    input{flex:1;min-width:280px;padding:10px}
    select,button{padding:10px 18px;cursor:pointer}
    button:disabled{cursor:wait;opacity:.65}
    #status{margin:10px 0}
    #chart{width:100%;height:700px}
  </style>
</head>
<body>
  <h1>Daily Range Forecast</h1>
  <div class="controls">
    <input id="url" value="https://kabutan.jp/stock/kabuka?code=4689&ashi=day">
    <select id="timeframe" aria-label="時間足">
      <option value="daily">日次</option>
      <option value="weekly">週次</option>
      <option value="monthly">月次</option>
    </select>
    <button id="load">読み込み</button>
    <button id="clear-cache" type="button">キャッシュを削除して再取得</button>
    <button id="copy-snapshot" type="button">スナップショットをコピー</button>
  </div>
  <div id="status"></div>
  <fieldset>
    <legend>スナップショット一括保存</legend>
    <label for="batch-config">銘柄コードのJSON設定ファイル</label>
    <input id="batch-config" type="file" accept=".json,application/json">
    <button id="batch-export" type="button">画像を生成してZIPをダウンロード</button>
    <p>形式: {"codes":["4689","7203"]}（最大100銘柄）。選択中の時間足で保存します。</p>
    <div id="batch-status" role="status" aria-live="polite"></div>
  </fieldset>
  <div id="chart"></div>
  <script src="/vendor/lightweight-charts/lightweight-charts.standalone.production.js"></script>
  <script src="/batch-export.js"></script>
  <script src="/app.js"></script>
</body>
</html>
