<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daily Range Forecast</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:20px;background:#111;color:#eee}
    .controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    input{flex:1;min-width:280px;padding:10px}
    select,button{padding:10px 18px;cursor:pointer}
    #status{margin:10px 0}
    #chart{width:100%;height:700px}
  </style>
</head>
<body>
  <h1>Daily Range Forecast</h1>
  <div class="controls">
    <input id="url" value="https://kabutan.jp/stock/kabuka?code=4689&ashi=day">
    <select id="timeframe" aria-label="時間足">
      <option value="daily">日次</option>
      <option value="weekly">週次</option>
      <option value="monthly">月次</option>
    </select>
    <button id="load">読み込み</button>
  </div>
  <div id="status"></div>
  <div id="chart"></div>
  <script src="/vendor/lightweight-charts/lightweight-charts.standalone.production.js"></script>
  <script src="/app.js"></script>
</body>
</html>
